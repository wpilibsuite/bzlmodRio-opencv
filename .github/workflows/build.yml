name: Build example project
on: [pull_request, push]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_native:
    strategy:
      fail-fast: false
      matrix:
        include:
        # Build non-bzlmod, native
        - { name: "windows     - native",    os: windows-2025,   java_arch: "x64",     command: "test",   config: "--noenable_bzlmod --enable_workspace --config=windows",     bazel_options: "--output_user_root=C:\\bazelroot", }
        - { name: "windows arm - native",    os: windows-11-arm, java_arch: "aarch64", command: "build",  config: "--noenable_bzlmod --enable_workspace --config=windows_arm", bazel_options: "--output_user_root=C:\\bazelroot", }
        - { name: "ubuntu      - native",    os: ubuntu-24.04,   java_arch: "x64",     command: "test",   config: "--noenable_bzlmod --enable_workspace --config=linux",       bazel_options: "",                                 }
        - { name: "macos       - native",    os: macos-15,       java_arch: "aarch64", command: "test",   config: "--noenable_bzlmod --enable_workspace --config=macos",       bazel_options: "",                                 }

        # Build bzlmod, native
        - { name: "windows     - bzlmod native", os: windows-2025,   java_arch: "x64",     command: "test",   config: "--enable_bzlmod --config=windows",     bazel_options: "--output_user_root=C:\\bazelroot", }
        - { name: "windows arm - bzlmod native", os: windows-11-arm, java_arch: "aarch64", command: "build",  config: "--enable_bzlmod --config=windows_arm", bazel_options: "--output_user_root=C:\\bazelroot", }
        - { name: "ubuntu      - bzlmod native", os: ubuntu-24.04,   java_arch: "x64",     command: "test",   config: "--enable_bzlmod --config=linux",       bazel_options: "",                                 }
        - { name: "macos       - bzlmod native", os: macos-15,       java_arch: "aarch64", command: "test",   config: "--enable_bzlmod --config=macos",       bazel_options: "",                                 }

    name: "Build - ${{ matrix.name }}"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with: { python-version: '3.12' }
    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 25
        architecture: ${{ matrix.java_arch }}
    - id: setup_build_buddy
      uses: ./.github/actions/setup-build-buddy
      with:
        token: ${{ secrets.BUILDBUDDY_API_KEY }}
    - run: bazel ${{ matrix.bazel_options }} build -k ${{ matrix.config }} --config=ci @bzlmodrio-opencv//...
      working-directory: tests
    - name: Build and allow failure # TODO Sometimes symlinks don't get created correctly the first time around
      run: bazel ${{ matrix.bazel_options }} build -k ${{ matrix.config }} --verbose_failures --config=ci //... || true
      working-directory: tests
    - name: Build
      run: bazel ${{ matrix.bazel_options }} ${{ matrix.command }} //... -k ${{ matrix.config }} --verbose_failures --config=ci
      working-directory: tests


  build_systemcore:
    strategy:
      fail-fast: false
      matrix:
        include:
        # Build non-bzlmod, systemcore
        - { name: "windows - systemcore",         os: windows-2025, java_arch: "x64",     command: "build", config: "--noenable_bzlmod --enable_workspace --config=systemcore", bazel_options: "--output_user_root=C:\\bazelroot", }
        - { name: "ubuntu  - systemcore",         os: ubuntu-24.04, java_arch: "x64",     command: "build", config: "--noenable_bzlmod --enable_workspace --config=systemcore", bazel_options: "",                                 }
        - { name: "macos   - systemcore",         os: macos-15,     java_arch: "aarch64", command: "build", config: "--noenable_bzlmod --enable_workspace --config=systemcore", bazel_options: "",                                 }

        # Build bzlmod, systemcore
        - { name: "windows - bzlmod systemcore",  os: windows-2025, java_arch: "x64",     command: "build", config: "--enable_bzlmod --config=systemcore", bazel_options: "--output_user_root=C:\\bazelroot", }
        - { name: "ubuntu  - bzlmod systemcore",  os: ubuntu-24.04, java_arch: "x64",     command: "build", config: "--enable_bzlmod --config=systemcore", bazel_options: "",                                 }
        - { name: "macos   - bzlmod systemcore",  os: macos-15,     java_arch: "aarch64", command: "build", config: "--enable_bzlmod --config=systemcore", bazel_options: "",                                 }
    name: "Build - ${{ matrix.name }}"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with: { python-version: '3.12' }
    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 25
        architecture: ${{ matrix.java_arch }}
    - id: setup_build_buddy
      uses: ./.github/actions/setup-build-buddy
      with:
        token: ${{ secrets.BUILDBUDDY_API_KEY }}
    - name: Build and allow failure # TODO Sometimes symlinks don't get created correctly the first time around
      run: bazel ${{ matrix.bazel_options }} ${{ matrix.command }} //... -k ${{ matrix.config }} --verbose_failures --config=ci || true
      working-directory: tests
    - name: Build
      run: bazel ${{ matrix.bazel_options }} ${{ matrix.command }} //... -k ${{ matrix.config }} --verbose_failures --config=ci
      working-directory: tests

  build_linuxarm64:
    strategy:
      fail-fast: false
      matrix:
        include:
        # Build non-bzlmod, linuxarm64
        - { name: "windows - linuxarm64",         os: windows-2025, java_arch: "x64",     command: "build", config: "--noenable_bzlmod --enable_workspace --config=linuxarm64", bazel_options: "--output_user_root=C:\\bazelroot", }
        - { name: "ubuntu  - linuxarm64",         os: ubuntu-24.04, java_arch: "x64",     command: "build", config: "--noenable_bzlmod --enable_workspace --config=linuxarm64", bazel_options: "",                                 }
        - { name: "macos   - linuxarm64",         os: macos-15,     java_arch: "aarch64", command: "build", config: "--noenable_bzlmod --enable_workspace --config=linuxarm64", bazel_options: "",                                 }

        # Build bzlmod, linuxarm64
        - { name: "windows - bzlmod linuxarm64",  os: windows-2025, java_arch: "x64",     command: "build", config: "--enable_bzlmod --config=linuxarm64", bazel_options: "--output_user_root=C:\\bazelroot", }
        - { name: "ubuntu  - bzlmod linuxarm64",  os: ubuntu-24.04, java_arch: "x64",     command: "build", config: "--enable_bzlmod --config=linuxarm64", bazel_options: "",                                 }
        - { name: "macos   - bzlmod linuxarm64",  os: macos-15,     java_arch: "aarch64", command: "build", config: "--enable_bzlmod --config=linuxarm64", bazel_options: "",                                 }
    name: "Build - ${{ matrix.name }}"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with: { python-version: '3.12' }
    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 25
        architecture: ${{ matrix.java_arch }}
    - id: setup_build_buddy
      uses: ./.github/actions/setup-build-buddy
      with:
        token: ${{ secrets.BUILDBUDDY_API_KEY }}
    - name: Build and allow failure # TODO Sometimes symlinks don't get created correctly the first time around
      run: bazel ${{ matrix.bazel_options }} ${{ matrix.command }} //... -k ${{ matrix.config }} --verbose_failures --config=ci || true
      working-directory: tests
    - name: Build
      run: bazel ${{ matrix.bazel_options }} ${{ matrix.command }} //... -k ${{ matrix.config }} --verbose_failures --config=ci
      working-directory: tests
